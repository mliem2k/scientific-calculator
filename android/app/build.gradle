plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

kotlin {
    jvmToolchain(21)
}

// scripts/release.js passes the unix time of the build; 0 marks a local build that skips update checks.
def buildNumber = (project.findProperty("buildNumber") ?: "0") as long

android {
    namespace 'com.mliem.scientific_calculator'
    compileSdk 37  // required by the current AndroidX releases; targetSdk stays 36

    defaultConfig {
        applicationId "com.mliem.scientific_calculator"
        minSdk 26
        targetSdk 36
        versionCode buildNumber > 0 ? (int) buildNumber : 1
        versionName buildNumber > 0 ? "build ${buildNumber}" : "dev"
        buildConfigField "long", "BUILD_NUMBER", "${buildNumber}L"
    }

    buildTypes {
        release {
            // The debug key keeps the signature of earlier releases so installs upgrade in place.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.datastore:datastore-preferences:1.3.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    // android.jar ships org.json as stubs that throw on the plain JVM.
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}
